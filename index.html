<!doctype html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#10131A" />
  <title>todo-cenas</title>
  <meta name="description" content="To-do list local-first com calendário Google em leitura, separando tarefas Pessoais das do BEST." />

  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" href="./icons/icon-192.png" />

  <!-- Tipografia: Sora (conteúdo) + IBM Plex Mono (estrutura/dados) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Tailwind (modo CDN, sem passo de build) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: ['class'],
      theme: {
        extend: {
          fontFamily: {
            sans: ['Sora', 'ui-sans-serif', 'system-ui', 'sans-serif'],
            mono: ['"IBM Plex Mono"', 'ui-monospace', 'SFMono-Regular', 'monospace'],
          },
          colors: {
            surface: {
              0: 'var(--surface-0)', 1: 'var(--surface-1)',
              2: 'var(--surface-2)', 3: 'var(--surface-3)',
            },
            border: { DEFAULT: 'var(--border)', strong: 'var(--border-strong)' },
            ink: { DEFAULT: 'var(--text-primary)', muted: 'var(--text-muted)', faint: 'var(--text-faint)' },
            pessoal: { DEFAULT: 'var(--area-pessoal)', soft: 'var(--area-pessoal-soft)' },
            best: { DEFAULT: 'var(--area-best)', amber: 'var(--area-best-amber)', soft: 'var(--area-best-soft)' },
            danger: 'var(--danger)',
          },
        },
      },
    };
  </script>

  <link rel="stylesheet" href="./css/tokens.css" />
  <link rel="stylesheet" href="./css/app.css" />
</head>
<body class="font-sans bg-surface-0 text-ink antialiased">
  <div id="app">
    <!-- Ecrã de arranque simples enquanto os módulos carregam -->
    <div class="min-h-screen flex items-center justify-center">
      <div class="font-mono text-xs tracking-widest text-ink-faint uppercase">a abrir o caderno…</div>
    </div>
  </div>

  <script type="module" src="./js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {
          /* offline/PWA é um extra; a app funciona sem service worker */
        });
      });
    }
  </script>
</body>
</html>
